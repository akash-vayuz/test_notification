name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: flutter test


      - name: Build Apk
        run: flutter build apk --release


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk


              # Create Google service account JSON
      - name: Setup Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/service-account.json"

      # Install Google Drive CLI
      - name: Install gdrive uploader
        run: |
          pip install --upgrade google-api-python-client google-auth google-auth-httplib2

      # Upload APK to Google Drive
      - name: Upload APK to Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          python <<'PY'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SERVICE_ACCOUNT_FILE = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          FOLDER_ID = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          APK_PATH = "build/app/outputs/flutter-apk/app-release.apk"

          credentials = service_account.Credentials.from_service_account_file(
              SERVICE_ACCOUNT_FILE,
              scopes=["https://www.googleapis.com/auth/drive.file"]
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )

          file_metadata = {
              "name": "app-release.apk",
              "parents": [FOLDER_ID],
          }

          media = MediaFileUpload(
              APK_PATH,
              mimetype="application/vnd.android.package-archive",
              resumable=True,
          )

          uploaded_file = drive.files().create(
              body=file_metadata,
              media_body=media,
              fields="id,name,webViewLink"
          ).execute()

          print("Uploaded successfully!")
          print("File ID:", uploaded_file["id"])
          print("File name:", uploaded_file["name"])
          print("Drive link:", uploaded_file.get("webViewLink"))
          PY

      # Remove sensitive files
      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/upload-keystore.jks
          rm -f "$RUNNER_TEMP/service-account.json"

