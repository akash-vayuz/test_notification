# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: flutter test


      - name: Build Apk
        run: flutter build apk --release


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      
      
      - name: Restore Google OAuth token
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON" \
            > "$RUNNER_TEMP/google-token.json"
      
      - name: Install Google Drive dependencies
        run: |
          python3 -m pip install --upgrade \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib
      
      - name: Upload APK to Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_TOKEN_FILE: ${{ runner.temp }}/google-token.json
        run: |
          python3 <<'PY'
          import os
      
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
      
          SCOPES = [
              "https://www.googleapis.com/auth/drive"
          ]
      
          TOKEN_FILE = os.environ["GOOGLE_TOKEN_FILE"]
          FOLDER_ID = os.environ["GOOGLE_DRIVE_FOLDER_ID"]
      
          # Find APK generated by Flutter.
          apk_files = []
      
          for root, dirs, files in os.walk("build"):
              for filename in files:
                  if filename.endswith(".apk"):
                      apk_files.append(
                          os.path.join(root, filename)
                      )
      
          if not apk_files:
              raise RuntimeError("No APK found")
      
          print("APK files found:")
      
          for apk in apk_files:
              print(f"  {apk}")
      
          apk_path = apk_files[0]
      
          print(f"\nUploading: {apk_path}")
      
          # Load OAuth credentials.
          credentials = Credentials.from_authorized_user_file(
              TOKEN_FILE,
              SCOPES,
          )
      
          # Refresh access token if needed.
          if credentials.expired and credentials.refresh_token:
              credentials.refresh(Request())
      
          if not credentials.valid:
              raise RuntimeError(
                  "Google OAuth credentials are invalid"
              )
      
          drive = build(
              "drive",
              "v3",
              credentials=credentials,
          )
      
          # Verify destination folder.
          folder = drive.files().get(
              fileId=FOLDER_ID,
              fields="id,name,mimeType,capabilities",
          ).execute()
      
          print(f"Destination folder: {folder['name']}")
      
          if not folder["capabilities"].get("canAddChildren"):
              raise RuntimeError(
                  "Google account does not have upload permission"
              )
      
          apk_name = os.path.basename(apk_path)
      
          metadata = {
              "name": apk_name,
              "parents": [FOLDER_ID],
          }
      
          media = MediaFileUpload(
              apk_path,
              mimetype="application/vnd.android.package-archive",
              resumable=True,
          )
      
          uploaded = drive.files().create(
              body=metadata,
              media_body=media,
              fields="id,name,parents,webViewLink",
          ).execute()
      
          print("\n========================================")
          print("APK UPLOAD SUCCESS")
          print("========================================")
          print(f"Name: {uploaded['name']}")
          print(f"ID:   {uploaded['id']}")
          print(f"Link: {uploaded.get('webViewLink')}")
          print("========================================")
          PY
      
      - name: Cleanup Google OAuth credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/google-token.json"
      
      
      # Remove sensitive files
      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/upload-keystore.jks
          rm -f "$RUNNER_TEMP/service-account.json"
      
